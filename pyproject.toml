[project]
name = "ticketing"
version = "0.1.0"
description = "Event ticketing platform backend"
readme = "README.md"
authors = [
    { name = "Shrisha", email = "shrishasj07@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
ticketing = "ticketing:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.14"
